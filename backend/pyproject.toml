[project]
name = "control-acceso-backend"
version = "0.1.0"
description = "Backend simplificado de control de acceso con QR dinamico (un solo uso)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "pydantic-settings>=2.5.2",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.12",
    "cryptography>=44",
    "pillow>=11",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "bcrypt>=4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
# Solo para scripts/biometric_degradation.py (ADR-16). Aparte del backend a proposito: el servidor
# del recinto no hace biometria, y la comparacion de ADR-16 corre en el navegador del guardia.
biometria = [
    "numpy>=2.1",
    "onnxruntime>=1.20",
]
